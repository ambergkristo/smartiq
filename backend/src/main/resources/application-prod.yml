management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

smartiq:
  import:
    fail-on-category-threshold: ${STRICT_DATASET_VALIDATION:${SMARTIQ_IMPORT_FAIL_ON_CATEGORY_THRESHOLD:false}}
  game:
    session-store: ${SMARTIQ_GAME_SESSION_STORE:redis}
    session-retention-minutes: ${SMARTIQ_GAME_SESSION_RETENTION_MINUTES:180}
    session-max: ${SMARTIQ_GAME_SESSION_MAX:50000}
  room:
    session-store: ${SMARTIQ_ROOM_SESSION_STORE:redis}
    room-retention-minutes: ${SMARTIQ_ROOM_RETENTION_MINUTES:180}
    room-max: ${SMARTIQ_ROOM_MAX:20000}
  language:
    et-enabled: ${SMARTIQ_LANGUAGE_ET_ENABLED:false}
  api:
    errors:
      legacy-shape-enabled: ${SMARTIQ_API_ERRORS_LEGACY_SHAPE_ENABLED:false}
  bank:
    block-on-low-bank: true
    trigger-pipeline-on-low-bank: false
  internal-access:
    enabled: true
  auth:
    context:
      header-fallback-enabled: false
      jwt-secret: ${SMARTIQ_AUTH_JWT_SECRET:}
      magic-link-echo-enabled: false
  billing:
    provider: ${SMARTIQ_BILLING_PROVIDER:}
    checkout-base-url: ${SMARTIQ_BILLING_CHECKOUT_BASE_URL:}
    success-return-url: ${SMARTIQ_BILLING_SUCCESS_RETURN_URL:}
    cancel-return-url: ${SMARTIQ_BILLING_CANCEL_RETURN_URL:}
    webhook-signing-secret: ${SMARTIQ_BILLING_WEBHOOK_SIGNING_SECRET:}
    webhook-signature-header: ${SMARTIQ_BILLING_WEBHOOK_SIGNATURE_HEADER:X-SmartIQ-Billing-Signature}
