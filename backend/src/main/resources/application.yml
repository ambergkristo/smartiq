spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartiq}
    username: ${SPRING_DATASOURCE_USERNAME:smartiq}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    placeholders:
      seed_core_enabled: false
  h2:
    console:
      enabled: true

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

smartiq:
  build:
    commit-sha: ${SMARTIQ_BUILD_SHA:unknown}
    time: ${SMARTIQ_BUILD_TIME:unknown}
  import:
    enabled: ${SMARTIQ_IMPORT_ENABLED:true}
    path: ${SMARTIQ_IMPORT_PATH:../data/smart10/cards.en.json}
    fail-on-category-threshold: ${STRICT_DATASET_VALIDATION:${SMARTIQ_IMPORT_FAIL_ON_CATEGORY_THRESHOLD:false}}
  pool:
    enabled: ${SMARTIQ_POOL_ENABLED:true}
    minimum-per-key: ${MIN_BANK_SIZE:1000}
    low-watermark-per-key: ${POOL_LOW_WATERMARK:800}
    refill-target-per-key: ${POOL_TARGET:1200}
  session:
    enabled: ${SMARTIQ_SESSION_DEDUP_ENABLED:true}
    store: ${SMARTIQ_SESSION_STORE:memory}
    ttl-minutes: ${SMARTIQ_SESSION_TTL_MINUTES:120}
    max-sessions: ${SMARTIQ_SESSION_MAX:50000}
    redis-prefix: ${SMARTIQ_SESSION_REDIS_PREFIX:smartiq:game-history:}
  dataset:
    min-category-threshold: ${SMARTIQ_MIN_CATEGORY_THRESHOLD:100}
  language:
    et-enabled: ${SMARTIQ_LANGUAGE_ET_ENABLED:false}
  game:
    session-retention-minutes: ${SMARTIQ_GAME_SESSION_RETENTION_MINUTES:180}
    session-max: ${SMARTIQ_GAME_SESSION_MAX:50000}
    session-store: ${SMARTIQ_GAME_SESSION_STORE:memory}
    session-redis-prefix: ${SMARTIQ_GAME_SESSION_REDIS_PREFIX:smartiq:game-session:}
  room:
    session-store: ${SMARTIQ_ROOM_SESSION_STORE:memory}
    session-redis-prefix: ${SMARTIQ_ROOM_SESSION_REDIS_PREFIX:smartiq:room-session:}
    room-retention-minutes: ${SMARTIQ_ROOM_RETENTION_MINUTES:180}
    room-max: ${SMARTIQ_ROOM_MAX:20000}
  bank:
    min-size: ${MIN_BANK_SIZE:1000}
    block-on-low-bank: ${STRICT_BANK_VALIDATION:${SMARTIQ_BLOCK_ON_LOW_BANK:false}}
    trigger-pipeline-on-low-bank: ${SMARTIQ_TRIGGER_PIPELINE_ON_LOW_BANK:false}
    pipeline-command: ${SMARTIQ_PIPELINE_COMMAND:npm run pipeline:cards}
  cors:
    allowed-origins:
      - ${SMARTIQ_CORS_ALLOWED_ORIGIN_PUBLIC:https://smartiq.vercel.app}
  internal-access:
    enabled: ${SMARTIQ_INTERNAL_ACCESS_ENABLED:false}
    api-key-header: ${SMARTIQ_INTERNAL_API_KEY_HEADER:X-Internal-Api-Key}
    api-key: ${SMARTIQ_INTERNAL_API_KEY:}
    protected-actuator-paths:
      - /actuator/metrics
      - /actuator/env
      - /actuator/configprops
      - /actuator/beans
  auth:
    context:
      header-fallback-enabled: ${SMARTIQ_AUTH_HEADER_FALLBACK_ENABLED:true}
      user-email-header: ${SMARTIQ_AUTH_USER_EMAIL_HEADER:X-SmartIQ-User-Email}
      tenant-id-header: ${SMARTIQ_AUTH_TENANT_ID_HEADER:X-SmartIQ-Tenant-Id}
      email-claims:
        - ${SMARTIQ_AUTH_EMAIL_CLAIM_PRIMARY:email}
        - ${SMARTIQ_AUTH_EMAIL_CLAIM_SECONDARY:preferred_username}
        - ${SMARTIQ_AUTH_EMAIL_CLAIM_TERTIARY:upn}
        - ${SMARTIQ_AUTH_EMAIL_CLAIM_FALLBACK:sub}
      tenant-id-claim: ${SMARTIQ_AUTH_TENANT_ID_CLAIM:tenant_id}
      jwt-secret: ${SMARTIQ_AUTH_JWT_SECRET:smartiq-dev-runtime-secret-change-me}
      issuer: ${SMARTIQ_AUTH_JWT_ISSUER:smartiq-runtime}
      audience: ${SMARTIQ_AUTH_JWT_AUDIENCE:smartiq-runtime}
      clock-skew-seconds: ${SMARTIQ_AUTH_CLOCK_SKEW_SECONDS:30}
      bootstrap-token-ttl-seconds: ${SMARTIQ_AUTH_BOOTSTRAP_TOKEN_TTL_SECONDS:3600}
      magic-link-echo-enabled: ${SMARTIQ_AUTH_MAGIC_LINK_ECHO_ENABLED:true}
      login-challenge-ttl-seconds: ${SMARTIQ_AUTH_LOGIN_CHALLENGE_TTL_SECONDS:900}
  billing:
    provider: ${SMARTIQ_BILLING_PROVIDER:}
    checkout-base-url: ${SMARTIQ_BILLING_CHECKOUT_BASE_URL:}
    success-return-url: ${SMARTIQ_BILLING_SUCCESS_RETURN_URL:}
    cancel-return-url: ${SMARTIQ_BILLING_CANCEL_RETURN_URL:}
    webhook-signing-secret: ${SMARTIQ_BILLING_WEBHOOK_SIGNING_SECRET:smartiq-dev-billing-secret-change-me}
    webhook-signature-header: ${SMARTIQ_BILLING_WEBHOOK_SIGNATURE_HEADER:X-SmartIQ-Billing-Signature}
  rate-limit:
    enabled: ${SMARTIQ_RATE_LIMIT_ENABLED:true}
    window-seconds: ${SMARTIQ_RATE_LIMIT_WINDOW_SECONDS:60}
    trust-forwarded-for: ${SMARTIQ_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    counter-max: ${SMARTIQ_RATE_LIMIT_COUNTER_MAX:50000}
    ws-rooms-per-minute: ${SMARTIQ_RATE_LIMIT_WS_ROOMS_PER_MINUTE:120}
    cards-next-per-minute: ${SMARTIQ_RATE_LIMIT_CARDS_NEXT_PER_MINUTE:120}
    game-per-minute: ${SMARTIQ_RATE_LIMIT_GAME_PER_MINUTE:240}
    rooms-per-minute: ${SMARTIQ_RATE_LIMIT_ROOMS_PER_MINUTE:120}
  api:
    errors:
      legacy-shape-enabled: ${SMARTIQ_API_ERRORS_LEGACY_SHAPE_ENABLED:false}
