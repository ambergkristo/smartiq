name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Validate docs markdown encoding (no BOM)
        run: node ../tools/validate_no_bom_docs.js ../docs

      - name: Validate Smart10 dataset
        run: node ../tools/validate_cards_v2.js ../data/smart10/cards.en.json --max-warnings=0

      - name: Validate locale packs (EN + ET required)
        run: node ../tools/validate_locale_packs.js ../data/smart10

      - name: Audit locale coverage (EN + ET, 6x6 baseline)
        run: node ../tools/audit_locale_coverage.js ../data/smart10 --required=en,et --min-per-combo=30

      - name: Score Smart10 dataset quality (threshold gate)
        run: node ../tools/score_cards_quality.js ../data/smart10/cards.en.json --fail-threshold=0.85

      - name: Score Smart10 ET dataset quality (threshold gate)
        run: node ../tools/score_cards_quality.js ../data/smart10/cards.et.json --fail-threshold=0.85

      - name: Semantic quality gate (EN >= 0.70)
        run: node ../tools/score_cards_semantic.js ../data/smart10/cards.en.json --fail-threshold=0.70

      - name: Semantic quality gate (ET >= 0.70)
        run: node ../tools/score_cards_semantic.js ../data/smart10/cards.et.json --fail-threshold=0.70

      - name: Semantic locale parity gate (blocking)
        run: node ../tools/report_semantic_locale_parity.js ../data/smart10/cards.en.json ../data/smart10/cards.et.json --min-category-score=NUMBER:0.90,COLOR:0.95 --max-short-option-ratio=NUMBER:0.40,COLOR:0.10 --max-locale-score-gap=0.02 --max-locale-warning-gap=10 --fail-on-exceed

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
