name: release-readiness

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical masterplan references
        run: node tools/validate_masterplan_reference.js

      - name: Validate beta KPI alert rules
        run: node tools/validate_beta_alert_rules.js

      - name: Validate main branch protection policy
        run: node tools/validate_branch_protection_policy.js

      - name: Validate session capacity guardrails
        run: node tools/validate_session_capacity_guardrails.js

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Core flow contract gate
        run: npm run gate:coreflows

      - name: Release readiness check
        run: npm run release:check
