name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Validate docs markdown encoding (no BOM)
        run: node ../tools/validate_no_bom_docs.js ../docs

      - name: Validate Flyway migration chain
        run: node ../tools/validate_flyway_migrations.js src/main/resources/db/migration

      - name: Validate beta KPI alert rules
        run: node ../tools/validate_beta_alert_rules.js ../ops/prometheus/smartiq-beta-kpi-alert-rules.yml

      - name: Validate main branch protection policy
        run: node ../tools/validate_branch_protection_policy.js ../docs/policies/main-branch-protection-policy.json

      - name: Validate session capacity guardrails
        run: node ../tools/validate_session_capacity_guardrails.js ../backend/src/main/resources/application-prod.yml

      - name: Validate Smart10 dataset
        run: node ../tools/validate_cards_v2.js ../data/smart10/cards.en.json --max-warnings=0

      - name: Validate locale packs (EN + ET required)
        run: node ../tools/validate_locale_packs.js ../data/smart10

      - name: Audit locale coverage (EN + ET, 6x6 baseline)
        run: node ../tools/audit_locale_coverage.js ../data/smart10 --required=en,et --min-per-combo=30

      - name: Score Smart10 dataset quality (threshold gate)
        run: node ../tools/score_cards_quality.js ../data/smart10/cards.en.json --fail-threshold=0.85

      - name: Score Smart10 ET dataset quality (threshold gate)
        run: node ../tools/score_cards_quality.js ../data/smart10/cards.et.json --fail-threshold=0.85

      - name: Semantic quality gate (EN >= 0.70)
        run: node ../tools/score_cards_semantic.js ../data/smart10/cards.en.json --fail-threshold=0.70

      - name: Semantic quality gate (ET >= 0.70)
        run: node ../tools/score_cards_semantic.js ../data/smart10/cards.et.json --fail-threshold=0.70

      - name: Semantic content honesty gate (EN >= 0.95)
        run: node ../tools/semantic_content_validator.js ../data/smart10/cards.en.json --fail-threshold=0.95

      - name: Semantic content honesty gate (ET >= 0.95)
        run: node ../tools/semantic_content_validator.js ../data/smart10/cards.et.json --fail-threshold=0.95

      - name: Semantic locale parity gate (blocking)
        run: node ../tools/report_semantic_locale_parity.js ../data/smart10/cards.en.json ../data/smart10/cards.et.json --min-category-score=NUMBER:0.90,COLOR:0.95 --max-short-option-ratio=NUMBER:0.20,COLOR:0.10 --max-locale-score-gap=0.02 --max-locale-warning-gap=10 --fail-on-exceed

      - name: Maven test
        run: mvn -q test

      - name: Maven build
        run: mvn -q -DskipTests package
