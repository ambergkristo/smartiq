name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Public backend base URL (https://...)"
        required: true
        type: string
      frontend_url:
        description: "Public frontend base URL (https://...)"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run post-deploy smoke
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
        run: npm run smoke:postdeploy

      - name: Verify deployment ops endpoints
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          SMARTIQ_INTERNAL_API_KEY: ${{ secrets.SMARTIQ_INTERNAL_API_KEY }}
        run: npm run smoke:ops
